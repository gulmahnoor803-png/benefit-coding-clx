<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title> Calculator</title>

<style>
    
 
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Poppins, sans-serif;
    }

   body {
    height: 100vh;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;


    background: linear-gradient(-45deg, #5181b4, #a53a8e, #ca824e, #afd576);
    background-size: 400% 400%;
    animation: shine 15s ease infinite;
}

@keyframes shine {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}


    .calc {
        width: 340px;
        padding: 20px;
        background: #2bbbd8;
        border-radius: 20px;
        box-shadow: 0 0 25px rgba(220, 120, 38, 0.1);
    }

    #display {
        width: 100%;
        height: 80px;
        font-size: 32px;
        border: none;
        outline: none;
        padding: 15px;
        text-align: right;
        border-radius: 10px;
        margin-bottom: 20px;
        background: #59d1dc;
        color: #fff;
    }

    .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
    }

    button {
        padding: 20px;
        font-size: 22px;
        border: none;
        border-radius: 14px;
        background: #2e7dab;
        color: #fff;
        cursor: pointer;
        transition: 0.2s;
    }

    button:active {
        transform: scale(0.92);
    }

    .operator {
        background: #596bc5;
    }

    .equal {
        background: #28a745;
        grid-column: span 2;
    }

    .clear {
        background: #db530e;
    }
</style>

</head>
<body>
<div class="calc">
    <input type="text" id="display" disabled>

    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">C</button>
        <button onclick="press('%')">%</button>
        <button onclick="press('/')">÷</button>
        <button class="operator" onclick="press('*')">×</button>

        <button onclick="press('7')">7</button>
        <button onclick="press('8')">8</button>
        <button onclick="press('9')">9</button>
        <button class="operator" onclick="press('-')">−</button>

        <button onclick="press('4')">4</button>
        <button onclick="press('5')">5</button>
        <button onclick="press('6')">6</button>
        <button class="operator" onclick="press('+')">+</button>

        <button onclick="press('1')">1</button>
        <button onclick="press('2')">2</button>
        <button onclick="press('3')">3</button>
        <button rowspan="2"></button>

        <button onclick="press('0')">0</button>
        <button onclick="press('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>
    </div>
</div>

<script>
    const disp = document.getElementById("display");

    function press(n) {
        disp.value += n;
    }

    function clearDisplay() {
        disp.value = "";
    }

    function calculate() {
        try {
            disp.value = eval(disp.value);
        } catch {
            disp.value = "Error";
        }
    }
</script>

</body>
</html>
